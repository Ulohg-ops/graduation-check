<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>化材系畢業學分檢核系統 - 使用說明</title>
  <link rel="stylesheet" href="/static/tailwind.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="flex justify-between items-center px-6 py-4 bg-white shadow-sm">
    <span class="font-bold text-gray-800">化材系畢業學分檢核系統</span>
    <a href="/" class="text-sm bg-gray-600 text-white px-3 py-1.5 rounded-md hover:bg-gray-700">← 回首頁</a>
  </header>

  <div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-8 my-8 space-y-6">
    <h1 class="text-xl font-bold">使用說明</h1>

    <section>
      <h2 class="font-semibold text-gray-800 mb-2">給同學：如何檢核畢業資格</h2>
      <ol class="list-decimal list-inside text-sm text-gray-700 space-y-1">
        <li>回到首頁，選擇你的入學學年度</li>
        <li>上傳你的成績單 PDF 檔</li>
        <li>點「檢核畢業資格」，系統會解析成績單中的課程與學分，並與該學年度的畢業門檻比對</li>
      </ol>
    </section>

    <section>
      <h2 class="font-semibold text-gray-800 mb-2">給系辦人員：如何調整應修科目表</h2>
      <ol class="list-decimal list-inside text-sm text-gray-700 space-y-1">
        <li>點右上角「調整應修科目表」進入管理頁面</li>
        <li>用「學年度」下拉選單切換要編輯的學年度</li>
        <li>右上角小表單可以直接輸入課程名稱與學分，按「＋新增科目」加入應修科目表</li>
        <li>每一列科目後面有「編輯」「刪除」可以修改或移除</li>
        <li>可以直接調整該學年度的「畢業總學分門檻」數字，按「儲存」即可生效</li>
      </ol>
    </section>
  </div>
</body>
</html>
