<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>畢業學分檢核系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-md">
    <h1 class="text-xl font-bold mb-6 text-center">畢業學分檢核系統</h1>
    <form action="/check" method="post" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">入學學年度</label>
        <select name="year" class="w-full border rounded-md p-2">
          {% for y in years %}
          <option value="{{ y }}">{{ y }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">上傳成績單 (PDF)</label>
        <input type="file" name="file" accept="application/pdf" required
               class="w-full border rounded-md p-2 text-sm" />
      </div>
      <button type="submit"
              class="w-full bg-blue-600 text-white font-medium py-2 rounded-md hover:bg-blue-700">
        檢核畢業資格
      </button>
    </form>
  </div>
</body>
</html>
